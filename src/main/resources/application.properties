spring.application.name=EduNexus-notification_and_communication

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:edunexus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ll157301}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.no99.edunexusnotification_and_communication.entity
mybatis.type-handlers-package=com.no99.edunexusnotification_and_communication.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.com.no99.edunexusnotification_and_communication.mapper=debug

# Nacos Configuration (Disabled)
 spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:47.100.171.209:8848}
 spring.config.import=optional:nacos:EduNexus-notification_and_communication.properties

# Disable Nacos Discovery and Config
spring.cloud.nacos.discovery.enabled=${NACOS_ENABLED:false}
spring.cloud.nacos.config.enabled=${NACOS_ENABLED:false}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
